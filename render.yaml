services:
  # Main API Service
  - type: web
    name: agrikonnect-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrikonnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NOTIFICATION_SERVICE_URL
        value: https://agrikonnect-notifications.onrender.com
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://agrikonnect-frontend.vercel.app,http://localhost:5173,https://agrikon-git-main-samuelgbgits-projects.vercel.app,https://agrikon-git-bugs-samuekls-projects-fef06831.vercel.app
      - key: FRONTEND_URL
        value: https://agrikonnect-frontend.vercel.app

  # Notification Microservice
  - type: web
    name: agrikonnect-notifications
    env: python
    region: oregon
    rootDir: microservices/notifications
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrikonnect-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: agrikonnect-db
    databaseName: agrikonnect
    user: agrikonnect
    region: oregon
